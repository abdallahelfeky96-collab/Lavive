# Gradle JVM memory — prevent GC thrashing on first build.
# 4 GB heap + 1 GB Metaspace is comfortable for a Flutter project with many plugins.
org.gradle.jvmargs=-Xmx4096m -Xms512m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Run Gradle tasks in parallel where possible.
org.gradle.parallel=true

# Keep the Gradle daemon alive between builds for faster incremental builds.
org.gradle.daemon=true

# Use the configuration cache for faster builds (experimental but stable in Gradle 8+).
# org.gradle.configuration-cache=true

# Android-specific
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Use manually-installed JDK 21 LTS (Gradle 8.14.1 does not support the default JDK 25).
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot

# Plugin modules compile Java at 1.8 but Kotlin at JDK 21; validate as warning instead of failing.
kotlin.jvm.target.validation.mode=warning
